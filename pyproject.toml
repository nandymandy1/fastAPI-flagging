[project]
name = "risk-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.1",
    "fastapi[standard]>=0.162.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "standardwebhooks>=1.1.0",
    "strands-agents[bedrock]>=1.64.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
